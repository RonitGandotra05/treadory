[build]
  command = "npm run build && npm test"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_SITE_URL = "https://treadory.netlify.app/"

# Netlify’s GitHub App builds, checks and publishes main automatically.
# Branch deploys and deploy previews are disabled in the site configuration.
# No server functions, paid analytics or duplicate GitHub push builds.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex"

# Allow crawling so Google can read these noindex headers. Utility files and
# binary downloads should not compete with the public product pages in Search.
[[headers]]
  for = "/agents.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy/index.html"
  to = "/privacy/"
  status = 301
  force = true
