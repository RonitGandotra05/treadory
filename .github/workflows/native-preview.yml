name: Windows app and legacy helper checks
on:
  pull_request:
    branches: [main]
    paths: ['native/**', 'verification/**', 'scripts/*helper*.mjs', 'scripts/*app*.mjs', '.github/workflows/native-preview.yml']
  push:
    branches: [main]
    paths: ['native/**', 'verification/**', 'scripts/*app*.mjs', '.github/workflows/native-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: dotnet run --project native/windows-app-tests
      - run: dotnet publish native/windows-app -c Release -r win-x64 -o releases/windows-app
      - name: Test freshly published and website standalone EXEs
        shell: pwsh
        run: |
          $env:TREADORY_UI_SCREENSHOT = "$pwd/treadory-windows-ui.png"
          foreach ($exe in @("releases/windows-app/Treadory.exe", "native/windows-app/distribution/win-x64/Treadory.exe")) {
            foreach ($mode in @("--self-test", "--ui-test", "--guard-test")) {
              $process = Start-Process $exe -ArgumentList $mode -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "$exe $mode failed: $($process.ExitCode)" }
            }
          }
      - run: node scripts/package-app.mjs
      - run: dotnet run --project native/windows -- --self-test
      - run: dotnet publish native/windows -c Release -r win-x64 --self-contained false -o releases/windows/host
      - run: node scripts/package-helper.mjs
      - run: .\releases\windows\host\treadory-helper.exe --self-test
      - name: Test the legacy helper executable
        run: .\native\windows\distribution\win-x64\treadory-helper.exe --self-test
      - name: Validate installation and recovery scripts
        shell: pwsh
        run: .\verification\windows-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: treadory-windows-x64-standalone-preview
          path: |
            releases/windows-app/Treadory.exe
            treadory-windows-ui.png
          retention-days: 7
      # Driver installation and real pedal verification are explicit manual gates.

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/package-platforms.py macos --gui-test
      - uses: actions/upload-artifact@v4
        with:
          name: Treadory-0.3.0-macos-arm64-preview
          path: native/platform-distributions/*macos*
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-tk python3-evdev python3-dbus python3-gi xvfb
      - run: python3 verification/linux-policy.test.py
      - run: python3 scripts/package-platforms.py linux
      - run: dpkg-deb --info native/platform-distributions/Treadory-0.3.0-linux-all-preview.deb
      - run: sudo dpkg --install native/platform-distributions/Treadory-0.3.0-linux-all-preview.deb
      - run: xvfb-run -a /usr/bin/treadory --ui-test
      - run: sudo /usr/bin/python3 verification/linux-os-api.py
      - uses: actions/upload-artifact@v4
        with:
          name: Treadory-0.3.0-linux-all-preview-unverified-input
          path: native/platform-distributions/*linux*

  browser:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://treadory.netlify.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - run: TEST_BROWSERS=chromium node verification/right-click-browser.mjs
      - run: node verification/installed-extension.mjs
